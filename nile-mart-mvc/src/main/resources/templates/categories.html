<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nile-Mart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

<nav style="margin-bottom: 20px;">
    <a th:href="@{/products}" style="margin-right: 15px; text-decoration: none; color: #333; font-weight: bold;">Products</a>
    <a th:href="@{/categories}" style="margin-right: 15px; text-decoration: none; color: #333; font-weight: bold;">Categories</a>
    <a th:href="@{/brands}" style="margin-right: 15px; text-decoration: none; color: #333; font-weight: bold;">Brands</a>
</nav>

<h1>Available Categories</h1>

<p>
    <a th:href="@{/categories/new}">Add New Category</a>
</p>

<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Slug</th>
        <th>Parent Slug</th>
        <th>Order</th>
        <th>Active</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="cat : ${categories}">

        <td th:text="${cat.parentSlug != null and !cat.parentSlug.isEmpty() ? '- ' + cat.name : cat.name}"></td>
        <td th:text="${cat.slug}"></td>
        <td th:text="${cat.parentSlug}"></td>
        <td th:text="${cat.displayOrder}"></td>
        <td th:text="${cat.active ? 'Yes' : 'No'}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
