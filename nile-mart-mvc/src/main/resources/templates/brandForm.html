<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nile-Mart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        form {
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
            width: 400px;
        }

        label {
            display: block;
            margin-bottom: 15px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        span {
            color: red;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<h1>Add New Brand</h1>

<form th:action="@{/brands}" th:object="${brand}" method="post">
    <label>Name
        <input th:field="*{name}">
    </label>
    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>

    <label>Slug
        <input th:field="*{slug}">
    </label>
    <span th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}"></span>

    <label>
        <input type="checkbox" th:field="*{active}"> Active
    </label>

    <button type="submit">Save Brand</button>
</form>

<br>
<a th:href="@{/brands}">Back to brands</a>

</body>
</html>
